server.port=8080
spring.application.name=ticket-service

# Configuracion de almacenamiento temporal EFS
# En el contenedor se monta en /app/efs desde /mnt/efs en la EC2
storage.efs.path=${EFS_PATH:/app/efs}
storage.efs.local-fallback=./efs_storage

# Configuracion de AWS S3
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET:duoc-cloud-tickets-bucket}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.session-token=${AWS_SESSION_TOKEN:}

# Modo de simulacion si no hay conexion con AWS
aws.s3.simulation-mode=${AWS_S3_SIMULATION_MODE:auto}
storage.s3.simulated-path=./s3_simulated_storage

# Logs
logging.level.cl.duoc.cloud=INFO
