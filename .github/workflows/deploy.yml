name: CI/CD Pipeline - Build, Test & Deploy to AWS EC2 with EFS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test Microservice
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Build and Run Unit Tests
        run: ./mvnw clean test

      - name: Package JAR Application
        run: ./mvnw package -DskipTests

  docker-build-push:
    name: Build & Push Docker Image to Docker Hub
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ticket-service:latest

  deploy-to-ec2:
    name: Continuous Deployment to AWS EC2 Instance
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "=== INICIANDO DESPLIEGUE EN AWS EC2 ==="
            
            # 1. Asegurar que el directorio de montaje de EFS exista
            sudo mkdir -p /mnt/efs
            
            # 2. Descargar la imagen mas reciente desde Docker Hub
            echo "Descargando la imagen mas reciente de Docker Hub..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest
            
            # 3. Detener y remover contenedor previo si existe
            if [ "$(docker ps -aq -f name=my-app)" ]; then
              echo "Deteniendo contenedor anterior..."
              docker stop my-app || true
              docker rm my-app || true
            fi
            
            # 4. Ejecutar el nuevo contenedor con el volumen montado en EFS (/mnt/efs -> /app/efs)
            echo "Iniciando nuevo contenedor con volumen EFS montado..."
            docker run -d \
              --name my-app \
              -v /mnt/efs:/app/efs \
              -p 8080:8080 \
              --restart unless-stopped \
              -e AWS_REGION="${{ secrets.AWS_REGION }}" \
              -e AWS_S3_BUCKET="${{ secrets.AWS_S3_BUCKET }}" \
              -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              -e AWS_SESSION_TOKEN="${{ secrets.AWS_SESSION_TOKEN }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest
            
            echo "=== DESPLIEGUE COMPLETADO CON EXITO ==="
            docker ps | grep my-app
